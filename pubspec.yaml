name: tribal_scholar_saathi
description: >
  Unified mobile scholarship platform for ST students under the
  Ministry of Tribal Affairs (MoTA). Covers Pre-Matric, Post-Matric,
  Top Class, NFST, and National Overseas Scholarship schemes.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Navigation
  go_router: ^12.1.3

  # State Management
  provider: ^6.1.5

  # UI Components
  google_fonts: ^6.3.3
  flutter_animate: ^4.5.0
  percent_indicator: ^4.2.2
  auto_size_text: ^3.0.0
  font_awesome_flutter: ^10.7.0
  flutter_svg: ^2.1.0
  page_transition: ^2.1.0

  # Networking & Data
  cached_network_image: ^3.4.1
  json_path: ^0.7.2
  intl: ^0.20.2

  # Storage
  shared_preferences: ^2.5.3
  sqflite: ^2.3.3+1
  path_provider: ^2.1.4

  # Utilities
  url_launcher: ^6.3.1
  timeago: ^3.7.1
  from_css_color: ^2.0.0
  uuid: ^4.2.1
  pdf: ^3.12.0
  printing: ^5.14.3
  file_picker: ^11.0.3
  http: ^1.6.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/jsons/
